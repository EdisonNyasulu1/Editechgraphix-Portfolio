<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Editech Graphix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-brand-purple { background-color: #25092d; }
        .text-brand-orange { color: #fd991d; }
        .border-brand-orange { border-color: #fd991d; }
        .bg-brand-orange { background-color: #fd991d; }
    </style>
</head>
<body class="bg-brand-purple text-white font-sans min-h-screen flex flex-col">

    <nav class="p-6 border-b border-gray-800 bg-brand-purple sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">EdiTech <span class="text-brand-orange">graphix</span></h1>
            <a href="index.html" class="text-sm font-bold uppercase tracking-widest hover:text-brand-orange transition">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center py-16 px-6">
        <div class="max-w-2xl w-full bg-[#1a0620] p-8 md:p-12 rounded-3xl border border-gray-800 shadow-2xl">
            <header class="text-center mb-10">
                <h2 class="text-4xl font-black mb-2 text-brand-orange uppercase">Start a Project</h2>
                <p class="text-gray-400 italic">I bridge the gap between code and design for you.</p>
            </header>

            <form action="https://formspree.io/f/edisonnyasulu3@gmail.com" method="POST" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Phone Number</label>
                        <input type="tel" name="phone" required placeholder="+265..." 
                               class="w-full bg-[#25092d] border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-brand-orange transition text-white shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Personal Email</label>
                        <input type="email" name="email" required placeholder="your@email.com" 
                               class="w-full bg-[#25092d] border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-brand-orange transition text-white shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Select Service</label>
                    <div class="relative">
                        <select name="service" required 
                                class="w-full bg-[#25092d] border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-brand-orange transition text-white appearance-none shadow-inner">
                            <option value="" disabled selected>Select a service...</option>
                            <option value="Software Development">Software Development</option>
                            <option value="Graphic Design">Graphic Design</option>
                            <option value="Both (Software & Design)">Both (Software & Design)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-brand-orange">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-widest">Project Description</label>
                    <textarea name="description" rows="5" required placeholder="Describe what you really want..." 
                              class="w-full bg-[#25092d] border border-gray-700 rounded-xl p-4 focus:outline-none focus:border-brand-orange transition text-white shadow-inner"></textarea>
                </div>

                <button type="submit" 
                        class="w-full bg-brand-orange text-[#25092d] font-black py-4 rounded-xl uppercase tracking-widest hover:opacity-90 transition transform active:scale-95 shadow-lg">
                    Submit Request
                </button>
            </form>
        </div>
    </div>

    <footer class="py-8 text-center text-gray-600 text-xs tracking-widest">
        © 2026 Editech Graphix | Edison Nyasulu
    </footer>

</body>
</html>
